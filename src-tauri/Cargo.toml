[package]
name = "kbm-overlay"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "kbm_overlay_lib"
crate-type = ["lib", "cdylib", "staticlib"]
